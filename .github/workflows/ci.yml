name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  cli-lint-and-test:
    name: CLI lint + unit/integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Lint (ruff)
        run: ruff check tools/cli tests

      - name: Unit + integration + CLI tests
        run: python -m pytest -v

      - name: furaxxz doctor (informational)
        run: python -m pytest tests/test_cli.py::test_cli_doctor_runs -q
        continue-on-error: true

      - name: furaxxz validate (catalog)
        run: python -m tools.cli.furaxxz validate || true
        env:
          PYTHONPATH: tools/cli

  android-build:
    name: Android app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x apps/furaxxz/gradlew
        continue-on-error: true

      - name: Assemble debug APK
        working-directory: apps/furaxxz
        run: |
          if [ -f gradlew ]; then ./gradlew assembleDebug --no-daemon; else gradle assembleDebug --no-daemon; fi
